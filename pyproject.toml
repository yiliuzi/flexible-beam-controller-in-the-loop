[project]
name = "flexible-beam-controller-in-the-loop"
version = "0.1.0"
description = "Digital twin and controller-in-the-loop platform for flexible beam vibration control"
requires-python = ">=3.13"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".venv",
    "build",
    "data",
    "results",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"